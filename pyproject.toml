[build-system]
# hatchling builds out of tree: the Claude Code plugin starts the engine with
# `uvx --native-tls --python ">=3.14" --from ${CLAUDE_PLUGIN_ROOT}`, and a setuptools build would leave build/
# and *.egg-info inside the plugin folder, which must stay read-only.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# Installed from this repository only: the engine ships with a Claude Code
# plugin + MCP server and is not published to PyPI. (The pre-rename
# `eu-ai-act-scanner` name on PyPI belongs to an unrelated third-party project.)
name = "antifragile-harness"
version = "0.16.0"
description = "Scan any codebase for EU AI Act (Regulation 2024/1689 + Digital Omnibus Reg. 2026/1744) compliance evidence and gaps, grounded in real-world AI security incidents and authoritative article text. 24 analyzers (incl. MCP tool-chain security, Claude Code security posture, AST-gated Art. 50 transparency, and 7 agent-aware analyzers), deterministic operator-role + obligation inference, founder 3-bucket triage, SARIF 2.1.0 + Claude Security / Claude Compliance API ingestion, a vendored GenAI/agentic-AI incident corpus crosswalked across 12 frameworks (incl. EN 18286:2026), an autonomous scan->fix->rescan loop, and a 13-tool MCP server. Local-only static analysis with a Claude Code plugin."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrei Bacu", email = "andrei@antifragile-ai.net" }]
requires-python = ">=3.11"
keywords = ["eu-ai-act", "compliance", "ai-safety", "static-analysis", "claude-code-plugin", "regulation-2024-1689"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5",
    "structlog>=24.1",
    "pyyaml>=6.0",
    # The MCP server is how the Claude Code plugin and other agents use the
    # scanner, so its SDK is a core dependency. Pinned to a recent SDK
    # supporting Streamable HTTP + Origin validation (MCP spec 2025-11 / 2026).
    "mcp>=1.12",
]

[project.optional-dependencies]
# Kept so existing `antifragile-harness[mcp]` installs keep working; the MCP SDK
# is now a core dependency.
mcp = ["mcp>=1.12"]
# Regenerating the vendored incident corpus from the HuggingFace dataset.
sync = ["pyarrow>=15"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
antifragile-scan = "scanner.cli:main"
antifragile-scan-mcp = "scanner.mcp_server:main"
antifragile-fix = "scanner.fix_loop:main"

[project.urls]
Homepage = "https://github.com/Peaky8linders/antifragile-harness"
Repository = "https://github.com/Peaky8linders/antifragile-harness"
Issues = "https://github.com/Peaky8linders/antifragile-harness/issues"

[tool.hatch.build.targets.wheel]
# The package and its data files (scanner/data/*.json, *.css) ship; tests,
# docs and plugin files do not.
packages = ["scanner"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
# tests/fixtures/ holds sample apps the scanner reads as input (they import
# torch and other frameworks this project does not depend on), not code of this
# project, so `mypy .` leaves them out.
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
# The MCP SDK is the optional `[mcp]` extra, imported lazily inside
# scanner.mcp_server._load_server_class (1.x and 2.x module paths). CI type-checks
# with `.[dev]` only, so a missing install must not fail mypy.
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow is the optional `[sync]` extra, imported only inside
# scripts/sync_incident_corpus.py, so a missing install must not fail mypy.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
norecursedirs = ["tests/fixtures"]
