name: Publish to PyPI

# Publishes the engine to PyPI, so it can be installed by name instead of from
# the repository URL. Manual only: run it from the Actions tab after a release.
#
# One-time setup on pypi.org before the first run (no API token is stored):
#   Your account -> Publishing -> "Add a new pending publisher" (GitHub), with
#     PyPI project name: antifragile-harness
#     Owner:             Peaky8linders
#     Repository name:   antifragile-harness
#     Workflow name:     publish-pypi.yml
#     Environment name:  pypi
# The first successful run creates the project and claims the name.
#
# Until then the docs keep installing from the repository URL, and
# tests/test_docs_install.py rejects any instruction to install by name from
# PyPI. After the first publish, update both together.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check the metadata renders on PyPI
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
