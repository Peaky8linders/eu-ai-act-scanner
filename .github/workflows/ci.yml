name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository (no writes, no
# packages, no id-token). Explicit because the default token is broad.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported floor (requires-python) through the latest stable release.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy scanner

      - name: Test
        run: pytest -v

      # Art. 15(3)-(4) gate: the scanner's own adversarial / prompt-injection
      # detection and the incident grounding for injected-instruction threats.
      - name: Adversarial / prompt-injection regression tests
        run: pytest tests/test_adversarial.py tests/test_incident_grounding.py -q

      - name: Smoke-test CLI & accuracy benchmark
        run: |
          antifragile-scan tests/fixtures/sample_project --markdown
          antifragile-scan tests/fixtures/sample_project --founder
          antifragile-scan tests/fixtures/sample_project --article art14
          antifragile-scan --benchmark

  # The Claude Code plugin starts its MCP server with
  # `uvx --native-tls --python ">=3.14" --from ${CLAUDE_PLUGIN_ROOT} antifragile-scan-mcp` (.claude-plugin/plugin.json).
  # Start it exactly that way on each OS, with a cold uv cache like a founder's
  # first start, and check it answers the MCP handshake with every tool.
  plugin-mcp:
    name: plugin MCP server via uvx (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Start the plugin's MCP server as Claude Code does
        # only-managed makes uv download its own Python 3.14+ for the server, like a
        # founder with no 3.14+ installed: the slowest first start. The checker
        # itself runs on the runner's Python (the flag overrides the variable).
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv run --no-project --python-preference system scripts/check_plugin_mcp.py

      - name: Show which Pythons uv found or downloaded
        if: always()
        run: uv python list --only-installed
