name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository (no writes, no
# packages, no id-token). Explicit because the default token is broad.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      # Art. 15(3)-(4) gate: the scanner's own adversarial / prompt-injection
      # detection and the incident grounding for injected-instruction threats.
      - name: Adversarial / prompt-injection regression tests
        run: pytest tests/test_adversarial.py tests/test_incident_grounding.py -q

      - name: Smoke-test CLI
        run: |
          eu-ai-act-scan tests/fixtures/sample_project --markdown
          eu-ai-act-scan tests/fixtures/sample_project --article art14
